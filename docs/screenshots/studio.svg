<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">WaveVault secure message studio</title><desc id="d">Light interface for encrypting and embedding a message into a PNG carrier using a reversible integer wavelet transform.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f55f5"/><stop offset="1" stop-color="#45c9b0"/></linearGradient></defs><rect width="1200" height="760" rx="28" fill="#f4f1eb"/><rect x="30" y="24" width="1140" height="62" rx="18" fill="#fffdf9" stroke="#e4ded5"/><rect x="54" y="39" width="34" height="34" rx="11" fill="url(#g)"/><text x="101" y="63" fill="#25232a" font-family="Arial,sans-serif" font-size="22" font-weight="700">WaveVault</text><text x="906" y="62" fill="#8a8490" font-family="Arial,sans-serif" font-size="13">DWT + ENCRYPTION STUDIO</text><text x="58" y="147" fill="#745cf4" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">SECURE DATA TRANSMISSION</text><text x="58" y="196" fill="#26232a" font-family="Arial,sans-serif" font-size="38" font-weight="700">Hide a protected message in plain sight.</text><text x="58" y="228" fill="#77717b" font-family="Arial,sans-serif" font-size="15">Encrypt, permute, and embed into a lossless PNG carrier—then recover it with the same passphrase.</text><rect x="48" y="270" width="536" height="430" rx="24" fill="#fffdf9" stroke="#e2dcd3"/><text x="78" y="314" fill="#8e8791" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">ENCODE</text><text x="78" y="351" fill="#26232a" font-family="Arial,sans-serif" font-size="25" font-weight="700">Create a protected carrier</text><text x="78" y="393" fill="#77717b" font-family="Arial,sans-serif" font-size="13">Message</text><rect x="78" y="409" width="476" height="103" rx="13" fill="#f7f4ef" stroke="#dfd8ce"/><text x="96" y="441" fill="#504a54" font-family="Arial,sans-serif" font-size="14">Architecture review at 10:30.</text><text x="78" y="548" fill="#77717b" font-family="Arial,sans-serif" font-size="13">Passphrase</text><rect x="78" y="564" width="476" height="52" rx="13" fill="#f7f4ef" stroke="#dfd8ce"/><text x="96" y="596" fill="#77717b" font-family="Arial,sans-serif" font-size="18">••••••••••••••</text><rect x="78" y="638" width="476" height="44" rx="22" fill="url(#g)"/><text x="253" y="666" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Encode PNG</text><rect x="612" y="270" width="540" height="430" rx="24" fill="#fffdf9" stroke="#e2dcd3"/><text x="642" y="314" fill="#8e8791" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">WORKFLOW</text><text x="642" y="351" fill="#26232a" font-family="Arial,sans-serif" font-size="25" font-weight="700">Protection layers</text><g font-family="Arial,sans-serif"><rect x="642" y="389" width="480" height="72" rx="16" fill="#f3efff"/><circle cx="677" cy="425" r="17" fill="#745cf4"/><text x="671" y="431" fill="#fff" font-size="15" font-weight="700">1</text><text x="710" y="418" fill="#2d2930" font-size="15" font-weight="700">Encrypt the message</text><text x="710" y="440" fill="#77717b" font-size="12">PBKDF2-derived Fernet key</text><rect x="642" y="478" width="480" height="72" rx="16" fill="#eef9f5"/><circle cx="677" cy="514" r="17" fill="#45b99e"/><text x="671" y="520" fill="#fff" font-size="15" font-weight="700">2</text><text x="710" y="507" fill="#2d2930" font-size="15" font-weight="700">Transform and permute</text><text x="710" y="529" fill="#77717b" font-size="12">Integer Haar wavelet coefficients</text><rect x="642" y="567" width="480" height="72" rx="16" fill="#fff2e9"/><circle cx="677" cy="603" r="17" fill="#ef9867"/><text x="671" y="609" fill="#fff" font-size="15" font-weight="700">3</text><text x="710" y="596" fill="#2d2930" font-size="15" font-weight="700">Embed into lossless PNG</text><text x="710" y="618" fill="#77717b" font-size="12">Capacity and integrity checks included</text></g></svg>
